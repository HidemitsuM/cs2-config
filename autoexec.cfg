// ====================================================================
// CS2 OPTIMIZED AUTOEXEC CONFIG (VIEWMODEL OPTIMIZED VERSION)
// ====================================================================
// Version: 1.1.6
// Updated: 2026-06-23
// Author:  Player (Optimized for Tenkeyless Keyboard)
// ====================================================================

echo ">>> AUTOEXEC LOADING..."

// Forced Reset for any stuck movement keys
-jump; -attack; -attack2;

// --------------------------------------------------------------------
// 1. Mouse & Aim Synchronization
// --------------------------------------------------------------------
sensitivity "0.84"                 // Controlled mouse sensitivity (e.g., Great for 800 DPI)
zoom_sensitivity_ratio "0.9"      // 1:1 sensitivity ratio when scoped

// Mouse Yaw Settings (Horizontal Sensitivity)
m_yaw "0.022"                     // Default value (For 16:9 or 4:3 Black Bars)
// m_yaw "0.0165"                  // [TOGGLE] Change to "0.0165" if you play on 4:3 Stretched to maintain a 1:1 feel

// --------------------------------------------------------------------
// 2. Custom Keybinds, Weapon Slots & Communication
// --------------------------------------------------------------------
// Jump Bindings (Dual Bind)
bind "space" "+jump"              // Dual Bind 1: Jump with Spacebar
bind "mwheeldown" "+jump"         // Dual Bind 2: Jump with Mouse Wheel Down

// C4 Bind
bind "mwheelup" "slot5"           // C4 on Mouse Wheel Up

// Weapon Selection (Multi-Bind for Primary / Secondary)
bind "1" "slot1"                  // Equip Rifle/SMG (Keyboard Top Row)
bind "mouse4" "slot1"             // Equip Rifle/SMG (Mouse Front Side Button)

bind "2" "slot2"                  // Equip Pistol (Keyboard Top Row)
bind "mouse5" "slot2"             // Equip Pistol (Mouse Back Side Button)

// Communication Binds
bind "k" "+voicerecord"           // Push-to-Talk Voice Chat on K key
bind "i" "messagemode2"           // Team Chat (Text) on I key

// Left/Right Hand Viewmodel Toggle
// cl_prefer_lefthanded "1"                  // [TOGGLE] Sets default viewmodel to Left-Handed
// bind "h" "toggle cl_prefer_lefthanded 0 1" // [TOGGLE] Press H to toggle between Right and Left handed

// Config Quick Reload
bind "f8" "exec autoexec"        // Press F8 to instantly reload this config file

// --------------------------------------------------------------------
// 3. Network & Server Synchronization (Sub-tick Optimization)
// --------------------------------------------------------------------
rate "786432"                     // Max bandwidth rate for optimal connection

// Network Packet Buffering
cl_net_buffer_ticks "0"           // Minimizes packet buffering delay for lowest latency (LAN / Perfect Connection)
// cl_net_buffer_ticks "1"           // [TOGGLE] Use this if you experience minor packet loss or jitter/stuttering

// --------------------------------------------------------------------
// 4. Performance & FPS Optimization
// --------------------------------------------------------------------
fps_max "400"                     // Set to 400 for 240Hz+ monitors to maximize smoothness and minimize input lag
cl_autohelp "0"                   // 不要なゲーム内ヒントUI（視覚ノイズ）を非表示

// テレメトリ（FPS・Ping）設定
cl_hud_telemetry_frametime_show "2"       // FPS低下時にのみ右上表示（常時は2）
// cl_hud_telemetry_serverping_show "2"    // [削除] CS2で存在しないcvar
cl_hud_telemetry_net_misdelivery_show "2" // パケットロス発生時にのみ右上表示（常時は2）

// --------------------------------------------------------------------
// 5. Visuals, UI, Crosshair & Shake Setup
// --------------------------------------------------------------------
// Universal Static Crosshair & Recoil Shake Disable
cl_crosshair_recoil "0"           // Disables crosshair movement/follow during recoil (Keeps it locked at screen center)
cl_crosshairstyle "4"             // Static style (Does not expand or change when moving, shooting, or switching weapons)

// Screen & Network Judder Mitigation
cl_hud_telemetry_net_misdelivery_poor "0" // Mitigates visual stutter caused by minor network packet delivery issues

// Crosshair Appearance (High-Visibility Yellow)
cl_crosshaircolor "5"             // カスタムカラーモードを有効化
cl_crosshaircolor_r "255"         // 赤（Red）を最大に
cl_crosshaircolor_g "255"         // 緑（Green）を最大に（赤＋緑＝黄色）
cl_crosshaircolor_b "0"           // 青（Blue）をゼロに

// [TOGGLE] Crosshair Appearance (Alternative: Competitive Pro Green)
// cl_crosshaircolor "1"           // Green (Highest visibility across all maps)

// Crosshair Dimensions (Original Restored)
cl_crosshairsize "1.5"            // Small length for precise headshots
cl_crosshairthickness "1.0"       // Clean, thin lines
cl_crosshairgap "-3"              // Tight gap for standard resolutions
cl_crosshair_drawoutline "1"      // Adds a thin black outline to prevent losing the crosshair in bright areas
cl_crosshair_outlinethickness "1"
cl_crosshairdot "0"               // No center dot
cl_crosshairusealpha "1"
cl_crosshairalpha "255"           // Solid opacity

// Viewmodel Positioning (Minimizes Weapon Model Screen Coverage & Weapon Bob)
viewmodel_presetpos "0"           // カスタム座標を強制適用（起動時のデフォルトリセット防止）
viewmodel_fov "68"                // 武器モデルの視野角を最大値にして奥に遠ざける
viewmodel_offset_x "2.5"          // 武器の位置を限界まで右側に寄せる
viewmodel_offset_y "0"            // 突き出し量をニュートラルにしてブレ幅を抑制
viewmodel_offset_z "-2.0"         // 武器の位置を限界まで下げ、画面下に埋め込む

// [ROLLBACK_TAG] 元の設定（v1.1.1）に戻す場合は、上の5行を消して、下の4行の「//」を削除してください
// viewmodel_fov "68"
// viewmodel_offset_x "2.5"
// viewmodel_offset_y "2.0"
// viewmodel_offset_z "-2.0"

// Radar Settings for Better Situational Awareness
cl_radar_always_centered "0"     // Centers the map rather than the player to show more info
cl_radar_rotate "1"              // Rotates the radar based on player direction

// --------------------------------------------------------------------
// 6. Utility Binds (Thumb Layout Optimization)
// --------------------------------------------------------------------
// Instant Grenade Selection Binds (Prioritizing Flashbang on V)
bind "v" "slot7"                  // Instant Flashbang (Most accessible thumb key)
bind "c" "slot8"                  // Instant Smoke Grenade (Left of Flashbang)
bind "x" "slot10"                 // Instant Molotov / Incendiary (Far left thumb key)
bind "4" "slot6"                  // Instant HE Grenade (Index finger)

// Radar Zoom Toggle (Fixed Sub-tick Release Bug)
alias "+e_use_radar" "+use; cl_radar_scale 0.35"
alias "-e_use_radar" "-use; cl_radar_scale 0.7"
bind "e" "+e_use_radar"

// Crosshair Lineup Toggle
bind "n" "toggle cl_crosshairsize 1.5 1000" // "1.5" matches your universal crosshair size above

// --------------------------------------------------------------------
// 7. Save & Execute
// --------------------------------------------------------------------
host_writeconfig
echo ">>> AUTOEXEC LOADED SUCCESSFULLY!"
